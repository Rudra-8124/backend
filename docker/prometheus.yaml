global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/prometheus-alerts.yaml

scrape_configs:
  - job_name: 'amrutam-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:3000']
        labels:
          environment: 'production'
          service: 'amrutam-api'

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          service: 'otel-collector'
