openapi: 3.0.0
paths:
  /healthz:
    get:
      operationId: HealthController_healthz
      summary: Liveness probe
      parameters: []
      responses:
        "200":
          description: ""
      tags: &a1
        - Health
  /readyz:
    get:
      operationId: HealthController_readyz
      summary: Readiness probe
      parameters: []
      responses:
        "200":
          description: ""
      tags: *a1
  /auth/register:
    post:
      operationId: AuthController_register
      summary: Register a new patient or doctor
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDto"
      responses:
        "201":
          description: ""
      tags: &a2
        - Auth
  /auth/login:
    post:
      operationId: AuthController_login
      summary: Login — returns tokens or MFA challenge
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: ""
      tags: *a2
  /auth/mfa/verify:
    post:
      operationId: AuthController_verifyMfa
      summary: Complete MFA verification (login step 2)
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerifyDto"
      responses:
        "200":
          description: ""
      tags: *a2
  /auth/mfa/setup:
    post:
      operationId: AuthController_setupMfa
      summary: Generate TOTP secret and recovery codes
      parameters: []
      responses:
        "201":
          description: ""
      tags: *a2
      security:
        - access-token: []
  /auth/mfa/setup/confirm:
    post:
      operationId: AuthController_confirmMfaSetup
      summary: Confirm MFA setup with a TOTP code
      parameters: []
      responses:
        "201":
          description: ""
      tags: *a2
      security:
        - access-token: []
  /auth/refresh:
    post:
      operationId: AuthController_refresh
      summary: Refresh access token (rotates refresh token)
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenDto"
      responses:
        "200":
          description: ""
      tags: *a2
  /auth/logout:
    post:
      operationId: AuthController_logout
      summary: Logout — revoke refresh token
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenDto"
      responses:
        "200":
          description: ""
      tags: *a2
      security:
        - access-token: []
  /users/me:
    get:
      operationId: UsersController_getMe
      summary: Get current user profile
      parameters: []
      responses:
        "200":
          description: ""
      tags: &a3
        - Users
      security: &a4
        - access-token: []
    patch:
      operationId: UsersController_updateMe
      summary: Update current user profile
      parameters: []
      responses:
        "200":
          description: ""
      tags: *a3
      security: *a4
  /users/{id}:
    get:
      operationId: UsersController_getUser
      summary: Get user by ID (admin only)
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a3
      security: *a4
  /users:
    get:
      operationId: UsersController_listUsers
      summary: List users (admin only, keyset pagination)
      parameters:
        - name: cursor
          required: true
          in: query
          schema:
            type: string
        - name: limit
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a3
      security: *a4
  /doctors/{id}:
    get:
      operationId: DoctorsController_getDoctor
      summary: Get doctor profile by ID (cached with Redis)
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: Doctor profile
        "404":
          description: Doctor not found
      tags: &a5
        - doctors
      security: &a6
        - bearer: []
  /doctors/me:
    patch:
      operationId: DoctorsController_updateProfile
      summary: Update doctor profile (invalidates search and profile caches)
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDoctorProfileDto"
      responses:
        "200":
          description: Updated doctor profile
      tags: *a5
      security: *a6
  /availability/slots:
    post:
      operationId: AvailabilityController_createSlot
      summary: Create a single discrete availability slot (Doctor only)
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSlotDto"
      responses:
        "201":
          description: ""
      tags: &a7
        - Availability
      security:
        - access-token: []
  /availability/slots/bulk:
    post:
      operationId: AvailabilityController_bulkCreateSlots
      summary: Bulk generate availability slots from weekly schedule (Doctor only)
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCreateSlotsDto"
      responses:
        "201":
          description: ""
      tags: *a7
      security:
        - access-token: []
  /availability/slots/{id}:
    delete:
      operationId: AvailabilityController_cancelSlot
      summary: Cancel an unbooked availability slot (Doctor only)
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a7
      security:
        - access-token: []
  /availability/doctors/{doctorId}/slots:
    get:
      operationId: AvailabilityController_getDoctorSlots
      summary: Get doctor availability slots (Public/Patient)
      parameters:
        - name: doctorId
          required: true
          in: path
          schema:
            type: string
        - name: startDate
          required: false
          in: query
          description: Filter slots starting at or after this time
          schema:
            type: string
        - name: endDate
          required: false
          in: query
          description: Filter slots starting before or at this time
          schema:
            type: string
        - name: status
          required: false
          in: query
          description: Filter by slot status
          schema:
            enum:
              - AVAILABLE
              - HELD
              - RESERVED
              - BOOKED
              - COMPLETED
              - CANCELLED
              - BLOCKED
            type: string
      responses:
        "200":
          description: ""
      tags: *a7
  /consultations:
    post:
      operationId: ConsultationsController_bookConsultation
      summary: Book a consultation slot (Patient only, atomic conditional hold +
        outbox event)
      parameters:
        - name: Idempotency-Key
          in: header
          description: Unique idempotency key for state-changing request
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookConsultationDto"
      responses:
        "201":
          description: ""
      tags: &a8
        - Consultations
      security: &a9
        - access-token: []
    get:
      operationId: ConsultationsController_listConsultations
      summary: List consultations for current patient
      parameters: []
      responses:
        "200":
          description: ""
      tags: *a8
      security: *a9
  /consultations/{id}/start:
    patch:
      operationId: ConsultationsController_startConsultation
      summary: Start consultation (CONFIRMED -> IN_PROGRESS, Doctor only)
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: Unique idempotency key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a8
      security: *a9
  /consultations/{id}/complete:
    patch:
      operationId: ConsultationsController_completeConsultation
      summary: Complete consultation (IN_PROGRESS -> COMPLETED, Doctor only)
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: Unique idempotency key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteConsultationDto"
      responses:
        "200":
          description: ""
      tags: *a8
      security: *a9
  /consultations/{id}/cancel:
    patch:
      operationId: ConsultationsController_cancelConsultation
      summary: Cancel consultation (triggers refund if CONFIRMED)
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: Unique idempotency key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelConsultationDto"
      responses:
        "200":
          description: ""
      tags: *a8
      security: *a9
  /consultations/{id}/no-show:
    patch:
      operationId: ConsultationsController_markNoShow
      summary: Mark patient as NO_SHOW (CONFIRMED -> NO_SHOW, Doctor or Admin)
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: Unique idempotency key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a8
      security: *a9
  /consultations/{id}:
    get:
      operationId: ConsultationsController_getConsultation
      summary: Get consultation details (RBAC & ownership checked)
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a8
      security: *a9
  /webhooks/payments:
    post:
      operationId: PaymentsController_handlePaymentWebhook
      summary: Process payment provider webhook with HMAC signature verification
      parameters:
        - name: x-webhook-signature
          required: true
          in: header
          schema:
            type: string
        - name: x-signature
          required: true
          in: header
          schema:
            type: string
        - name: x-timestamp
          required: true
          in: header
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: &a10
        - Payments
  /webhooks/payment:
    post:
      operationId: PaymentsController_handlePaymentWebhookAlias
      summary: Alias for webhooks/payments
      parameters:
        - name: x-webhook-signature
          required: true
          in: header
          schema:
            type: string
        - name: x-signature
          required: true
          in: header
          schema:
            type: string
        - name: x-timestamp
          required: true
          in: header
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a10
  /payments/{id}:
    get:
      operationId: PaymentsController_getPaymentById
      summary: Get payment details by ID (Patient owner, Doctor assigned, or Admin)
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a10
      security:
        - access-token: []
  /admin/audit-logs:
    get:
      operationId: AuditController_getLogs
      summary: Query append-only audit logs with filters and keyset pagination (Admin
        only)
      parameters:
        - name: actor_id
          required: false
          in: query
          description: Filter by actor ID (user ID who performed action)
          schema:
            type: string
        - name: action
          required: false
          in: query
          description: Filter by action (e.g. AUTH_LOGIN, PHI_READ, PHI_WRITE)
          schema:
            type: string
        - name: resource_type
          required: false
          in: query
          description: Filter by resource type (e.g. prescription, consultation, user)
          schema:
            type: string
        - name: resource_id
          required: false
          in: query
          description: Filter by resource ID
          schema:
            type: string
        - name: date_from
          required: false
          in: query
          description: Start date (YYYY-MM-DD)
          schema:
            type: string
        - name: date_to
          required: false
          in: query
          description: End date (YYYY-MM-DD)
          schema:
            type: string
        - name: limit
          required: false
          in: query
          description: Number of records (1-100)
          schema:
            default: 50
            type: number
        - name: cursor
          required: false
          in: query
          description: Opaque pagination cursor (base64)
          schema:
            type: string
      responses:
        "200":
          description: Audit logs matching criteria
        "403":
          description: Forbidden — requires admin role
      tags: &a11
        - audit
      security: &a12
        - bearer: []
  /admin/audit-logs/verify:
    get:
      operationId: AuditController_verifyChain
      summary: Verify hash-chain cryptographic integrity of a monthly partition (Admin
        only)
      description: Traverses the partition audit log sequentially to prove that no
        rows were inserted, deleted, or mutated.
      parameters:
        - name: partition_month
          required: false
          in: query
          description: Partition month to verify (YYYY-MM-01). Defaults to current month.
          schema:
            type: string
      responses:
        "200":
          description: Verification result
        "403":
          description: Forbidden — requires admin role
      tags: *a11
      security: *a12
  /consultations/{id}/prescriptions:
    post:
      operationId: PrescriptionsController_createPrescription
      summary: Issue a prescription (Doctor only, only for IN_PROGRESS/COMPLETED
        consultations, encrypted with AES-256-GCM, audited)
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: Unique idempotency key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrescriptionDto"
      responses:
        "201":
          description: ""
      tags: &a13
        - Prescriptions
      security: &a14
        - access-token: []
    get:
      operationId: PrescriptionsController_getConsultationPrescriptions
      summary: Get prescriptions for a consultation (Assigned doctor, Patient owner,
        Admin; decrypted in-memory, audited)
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a13
      security: *a14
  /prescriptions/{id}:
    get:
      operationId: PrescriptionsController_getPrescriptionById
      summary: Get single prescription by ID (Assigned doctor, Patient owner, Admin;
        decrypted in-memory, audited)
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
      tags: *a13
      security: *a14
  /search/doctors:
    get:
      operationId: SearchController_searchDoctors
      summary: Search doctors with full-text, typo tolerance, multi-filter, and keyset
        pagination
      description: Queries verified doctors with full-text search over
        name/specialties/bio, trigram typo tolerance, filters for specialty,
        language, price, min rating, availability window, and opaque cursor
        pagination.
      parameters:
        - name: q
          required: false
          in: query
          description: Full-text & typo-tolerant search query (name, specialty, bio)
          schema:
            type: string
        - name: specialty
          required: false
          in: query
          description: Filter by specialty (e.g. Cardiology, Ayurveda, Dermatology)
          schema:
            type: string
        - name: city
          required: false
          in: query
          description: Filter by doctor city (e.g. Pune, Mumbai)
          schema:
            type: string
        - name: language
          required: false
          in: query
          description: Filter by spoken language (e.g. English, Hindi)
          schema:
            type: string
        - name: min_price
          required: false
          in: query
          description: Minimum consultation fee in cents
          schema:
            type: number
        - name: max_price
          required: false
          in: query
          description: Maximum consultation fee in cents
          schema:
            type: number
        - name: min_rating
          required: false
          in: query
          description: Minimum rating (0.00 to 5.00)
          schema:
            type: number
        - name: available_from
          required: false
          in: query
          description: Filter by availability window start (ISO date-time)
          schema:
            type: string
        - name: available_to
          required: false
          in: query
          description: Filter by availability window end (ISO date-time)
          schema:
            type: string
        - name: sort_by
          required: false
          in: query
          description: Sort criteria
          schema:
            default: relevance
            enum:
              - relevance
              - rating_desc
              - price_asc
              - price_desc
              - experience_desc
            type: string
        - name: limit
          required: false
          in: query
          description: Results limit per page (1-100)
          schema:
            default: 20
            type: number
        - name: cursor
          required: false
          in: query
          description: Opaque keyset cursor for pagination (base64)
          schema:
            type: string
      responses:
        "200":
          description: List of matching doctors with next page cursor
      tags:
        - search
      security:
        - bearer: []
  /admin/analytics/consultations:
    get:
      operationId: AdminAnalyticsController_getConsultationsAnalytics
      summary: Get consultations per day, cancellation/no-show rates, and revenue
        (Admin only)
      description: Queries materialized view for daily consultation counts, completion
        rate, cancellations, no-shows, and revenue. Enforces maximum 90-day
        window.
      parameters:
        - name: date_from
          required: true
          in: query
          description: Start date for analytics window (YYYY-MM-DD)
          schema:
            example: 2026-08-01
            type: string
        - name: date_to
          required: true
          in: query
          description: End date for analytics window (YYYY-MM-DD)
          schema:
            example: 2026-09-19
            type: string
      responses:
        "200":
          description: Consultations analytics report
        "400":
          description: Date range exceeds 90 days or invalid format
        "403":
          description: Forbidden — requires admin role
      tags: &a15
        - admin-analytics
      security: &a16
        - bearer: []
  /admin/analytics/doctors:
    get:
      operationId: AdminAnalyticsController_getDoctorsAnalytics
      summary: Get doctor utilization, completion rate, and revenue (Admin only)
      description: Aggregates consultations and slot utilization per doctor with
        keyset cursor pagination. Enforces maximum 90-day window.
      parameters:
        - name: date_from
          required: true
          in: query
          description: Start date for analytics window (YYYY-MM-DD)
          schema:
            example: 2026-08-01
            type: string
        - name: date_to
          required: true
          in: query
          description: End date for analytics window (YYYY-MM-DD)
          schema:
            example: 2026-09-19
            type: string
        - name: limit
          required: false
          in: query
          description: Number of doctors to return (1-100)
          schema:
            default: 20
            type: number
        - name: cursor
          required: false
          in: query
          description: Opaque pagination cursor (base64)
          schema:
            type: string
      responses:
        "200":
          description: Doctor utilization analytics report
        "400":
          description: Date range exceeds 90 days or invalid format
        "403":
          description: Forbidden — requires admin role
      tags: *a15
      security: *a16
  /admin/analytics/refresh:
    post:
      operationId: AdminAnalyticsController_refreshView
      summary: Refresh daily consultation analytics materialized view concurrently
        (Admin only)
      parameters: []
      responses:
        "200":
          description: Materialized view refreshed successfully
      tags: *a15
      security: *a16
info:
  title: Amrutam Telemedicine API
  description: Production-grade telemedicine backend
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    access-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          example: patient@example.com
        password:
          type: string
          example: SecureP@ss123!
          minLength: 8
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe
        role:
          type: string
          enum:
            - patient
            - doctor
          default: patient
        licenseNumber:
          type: string
          example: MED-12345
        specializations:
          example:
            - Ayurveda
            - General Medicine
          type: array
          items:
            type: string
        experienceYears:
          type: number
          example: 5
        feeCents:
          type: number
          example: 50000
          description: Fee in paise (INR cents)
      required:
        - email
        - password
        - firstName
        - lastName
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: patient@example.com
        password:
          type: string
          example: SecureP@ss123!
      required:
        - email
        - password
    MfaVerifyDto:
      type: object
      properties:
        mfaToken:
          type: string
          description: Short-lived MFA token from login step 1
        totpCode:
          type: string
          description: 6-digit TOTP code
        recoveryCode:
          type: string
          description: Single-use recovery code
      required:
        - mfaToken
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    UpdateDoctorProfileDto:
      type: object
      properties:
        bio:
          type: string
          description: Professional biography / summary
        specializations:
          description: List of medical specializations
          type: array
          items:
            type: string
        languages:
          description: Languages spoken
          type: array
          items:
            type: string
        fee_cents:
          type: number
          description: Consultation fee in cents
        experience_years:
          type: number
          description: Years of clinical experience
    CreateSlotDto:
      type: object
      properties:
        startTime:
          type: string
          example: 2026-10-01T09:00:00.000Z
          description: Slot start time in UTC ISO 8601 format
        durationMinutes:
          type: number
          example: 30
          description: Slot duration in minutes (between 10 and 120)
          default: 30
      required:
        - startTime
        - durationMinutes
    WeeklyScheduleItemDto:
      type: object
      properties:
        dayOfWeek:
          type: number
          example: 1
          description: "Day of week: 0=Sun, 1=Mon, ..., 6=Sat"
        startHour:
          type: number
          example: 9
          description: Start hour (0-23)
        startMinute:
          type: number
          example: 0
          description: Start minute (0-59)
        endHour:
          type: number
          example: 17
          description: End hour (0-23)
        endMinute:
          type: number
          example: 0
          description: End minute (0-59)
        slotDurationMinutes:
          type: number
          example: 30
          description: Slot duration in minutes
      required:
        - dayOfWeek
        - startHour
        - startMinute
        - endHour
        - endMinute
        - slotDurationMinutes
    BulkCreateSlotsDto:
      type: object
      properties:
        startDate:
          type: string
          example: 2026-10-01
          description: Start date (YYYY-MM-DD)
        endDate:
          type: string
          example: 2026-10-07
          description: End date (YYYY-MM-DD)
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyScheduleItemDto"
        timezone:
          type: string
          example: Asia/Kolkata
          description: Timezone for schedule generation; defaults to doctor profile timezone
      required:
        - startDate
        - endDate
        - schedule
    BookConsultationDto:
      type: object
      properties:
        slotId:
          type: string
          example: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
          description: The UUID of the availability slot to book
        reason:
          type: string
          example: Persistent headache and fatigue for 3 days
          description: Reason for consultation or chief symptoms
      required:
        - slotId
    CompleteConsultationDto:
      type: object
      properties:
